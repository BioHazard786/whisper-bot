services:
  whisper-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: psst-whisper-bot:latest
    container_name: psst-whisper-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
